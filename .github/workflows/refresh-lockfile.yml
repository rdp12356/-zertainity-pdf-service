name: Refresh PDF dependency lockfile
on:
  push:
    branches: [security/fail-closed-renderer-20261026]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recalculate lockfile with patched packages
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(deps): refresh PDF renderer lockfile"
          git push origin HEAD:security/fail-closed-renderer-20261026
